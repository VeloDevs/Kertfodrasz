# .github/workflows/ci.yml
name: Quality Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    env:
      PUBLIC_SITE_KEY: ${{ vars.PUBLIC_SITE_KEY }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependecies
        run: bun ci

      - name: Build test
        run: bun run build

      - name: Type check
        run: bun run check

      - name: Lint check
        run: bun run lint